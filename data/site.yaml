site:
  title: preserve.games - Video Game Preservation Portal
  hero:
    taglines:
      - lines:
          - Games are disappearing.
          - You can help.
      - lines:
          - Continue without saving?
    blurb:
      - Video games have been part of our culture for over 50 years, and have never been more popular than they are today. But unlike other art forms, the preservation of video game history and culture is largely underfunded and community driven.
      - Learn more about how you can help ensure games and their history are preserved and accessible for generations to come.
  footer: "© 2026 preserve.games · Connecting the video game preservation community"
  footer_credit:
    text: Owned and maintained by
    name: Hit Save!
    url: https://hitsave.org
    suffix: ", a 501(c)(3) nonprofit dedicated to game preservation through community awareness and involvement."
  suggest:
    text: Know an organization, guide, tool, community, or resource we should list? We review every suggestion.
    url: https://github.com/hitsave/preserve.games/issues/new?labels=submission&title=Resource%20suggestion&body=**Name%3A**%0A%0A**URL%3A**%0A%0A**Description%3A**%0A%0A**Why%20include%3A**%0A
    link_text: Suggest a resource

