opensource:
  emulators:
    - name: MAME
      description: Reference emulator preserving arcade, computer, and console systems through software lists and CHD imaging.
      url: https://www.mamedev.org/
      logo: assets/logos/mame.png
      logo_alt: MAME logo

    - name: Ares
      description: Cycle-accurate multi-system emulator for NES, SNES, Game Boy, Mega Drive, Saturn, and other classic hardware.
      url: https://ares-emu.net/
      logo: assets/logos/ares.png
      logo_alt: Ares logo

    - name: ScummVM
      description: Virtual machine preserving classic point-and-click and adventure games across many engines and platforms.
      url: https://www.scummvm.org/
      logo: assets/logos/scummvm.png
      logo_alt: ScummVM logo

    - name: DuckStation
      description: PlayStation emulator emphasizing accuracy, low overhead, and support for cue/bin and CHD dumps.
      url: https://www.duckstation.org/
      logo: assets/logos/duckstation.svg
      logo_alt: DuckStation logo

    - name: PCSX2
      description: PlayStation 2 emulator supporting ISO, CHD, and physical disc images for play and verification.
      url: https://pcsx2.net/
      logo: assets/logos/pcsx2.webp
      logo_alt: PCSX2 logo

    - name: RPCS3
      description: Open-source PlayStation 3 emulator for running decrypted disc and digital titles on desktop platforms.
      url: https://rpcs3.net/
      logo: assets/logos/rpcs3.png
      logo_alt: RPCS3 logo

    - name: PPSSPP
      description: PSP emulator that runs UMD ISOs and decrypted dumps on desktop and mobile platforms.
      url: https://www.ppsspp.org/
      logo: assets/logos/ppsspp.png
      logo_alt: PPSSPP logo

    - name: Dolphin
      description: GameCube and Wii emulator focused on compatibility, enhancements, and disc-based preservation workflows.
      url: https://dolphin-emu.org/
      logo: assets/logos/dolphin.svg
      logo_alt: Dolphin logo

    - name: Flycast
      description: Dreamcast, Naomi, and Atomiswave emulator supporting GD-ROM, GDI, and CHD preservation formats.
      url: https://github.com/flyinghead/flycast
      logo: assets/logos/flycast.png
      logo_alt: Flycast logo

    - name: melonDS
      description: Nintendo DS emulator with Wi-Fi support and focus on faithful hardware behavior.
      url: https://melonds.kuribo64.net/
      logo: assets/logos/melonds.ico
      logo_alt: melonDS logo

    - name: Azahar
      description: Active open-source Nintendo 3DS emulator, continuing development after Citra — supports CIA and 3DS dumps.
      url: https://azahar-emu.org/
      logo: assets/logos/azahar.svg
      logo_alt: Azahar logo

    - name: Xemu
      description: Original Xbox emulator supporting ISO and disc images for play and compatibility testing.
      url: https://xemu.app/
      logo: assets/logos/xemu.ico
      logo_alt: Xemu logo

    - name: RetroArch
      description: Cross-platform frontend bundling Libretro cores for accurate emulation across dozens of classic systems.
      url: https://www.retroarch.com/
      logo: assets/logos/retroarch.png
      logo_alt: RetroArch logo

  dumping_tools:
    - name: Open Source Cart Reader
      description: Arduino-based dumper recommended by Dumping.Guide for NES, SNES, N64, Game Boy, Mega Drive, and more.
      url: https://github.com/sanni/cartreader
      logo: assets/logos/cart-reader.png
      logo_alt: Open Source Cart Reader logo

    - name: FlashGBX
      description: Cross-platform software for dumping Game Boy and GBA carts via GBxCart RW, Joey Jr, and similar readers.
      url: https://github.com/Lesserkuma/FlashGBX
      logo: assets/logos/flashgbx.png
      logo_alt: FlashGBX logo

    - name: GodMode9
      description: Nintendo 3DS and DSi homebrew for dumping cartridges, saves, and system data to SD card.
      url: https://github.com/d0k3/GodMode9
      logo: assets/logos/godmode9.png
      logo_alt: GodMode9 logo

    - name: GodMode9i
      description: Nintendo DS and DSi file browser for dumping GBA and DS cartridges using a flashcart-equipped console.
      url: https://github.com/DS-Homebrew/GodMode9i
      logo: assets/logos/godmode9i.png
      logo_alt: GodMode9i logo

    - name: nxDumpTool
      description: Nintendo Switch homebrew for dumping game cards and installed titles to verified formats.
      url: https://github.com/DarkMatterCore/nxdumptool
      logo: assets/logos/nxdumptool.jpg
      logo_alt: nxDumpTool logo

    - name: redumper
      description: Redump's preferred open-source optical disc dumper for byte-perfect CD, DVD, and Blu-ray preservation.
      url: https://github.com/superg/redumper
      logo: assets/logos/redumper.png
      logo_alt: redumper logo

    - name: DiscImageCreator
      description: Redump-compatible CLI dumper for CD, GD-ROM, DVD, Blu-ray, GameCube, Wii, Xbox, and floppy media.
      url: https://github.com/saramibreak/DiscImageCreator
      logo: assets/logos/discimagecreator.png
      logo_alt: DiscImageCreator logo

    - name: Media Preservation Frontend
      description: GUI front-end bundling redumper, DiscImageCreator, and Aaru — recommended by Redump and Dumping.Guide.
      url: https://github.com/SabreTools/MPF
      logo: assets/logos/mpf.png
      logo_alt: Media Preservation Frontend logo

    - name: Aaru
      description: Data-preservation suite for imaging, analyzing, and converting floppy, optical, and exotic media.
      url: https://www.aaru.app/
      logo: assets/logos/aaru.png
      logo_alt: Aaru logo

    - name: CleanRip
      description: GameCube and Wii homebrew for creating raw disc dumps without modchip hardware.
      url: https://github.com/FIX94/CleanRip
      logo: assets/logos/cleanrip.png
      logo_alt: CleanRip logo

    - name: Media Authenticator
      description: Redump companion tool for verifying optical-disc dumps against community hash databases.
      url: https://github.com/redump/media-authenticator
      logo: assets/logos/media-authenticator.png
      logo_alt: Media Authenticator logo

    - name: ddrescue
      description: GNU data recovery tool used in Redump's CLI disc dumping guide for failing or difficult drives.
      url: https://www.gnu.org/software/ddrescue/
      logo: assets/logos/ddrescue.jpg
      logo_alt: ddrescue logo
