site:
  title: preserve.games - Video Game Preservation Portal
  hero:
    title: preserve.games
    subtitle: A gateway into the world of video game preservation
    text: Video game preservation is crucial for maintaining our digital cultural heritage. This portal connects you with organizations, guides, and resources dedicated to preserving the history and culture of video games for future generations.
  footer: "© 2026 preserve.games — Connecting the video game preservation community"
  footer_credit:
    text: Owned and maintained by
    name: Hit Save!
    url: https://hitsave.org

continents:
  - { id: all, label: All }
  - { id: africa, label: Africa }
  - { id: asia, label: Asia }
  - { id: europe, label: Europe }
  - { id: north-america, label: North America }
  - { id: south-america, label: South America }
  - { id: oceania, label: Oceania }
  - { id: visitable, label: Visit in person }

