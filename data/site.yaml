guides:
  - name: Dumping.Guide
    description: Learn how to create accurate digital copies of game data from physical media.
    url: https://dumping.guide
    logo: assets/logos/dumping.guide.png
    logo_alt: Dumping Guide logo

  - name: Scanning.Guide
    description: Guidelines for scanning game-related materials like manuals, box art, and documentation.
    url: https://scanning.guide
    logo: assets/logos/scanning.guide.png
    logo_alt: Scanning Guide logo

  - name: Preservation.Guide
    description: General best practices and comprehensive information about preserving video games and related content.
    url: https://preservation.guide
    logo: assets/logos/preservation.guide.png
    logo_alt: Preservation Guide logo

  - name: Restore and Replay (Eldoug)
    description: Expert video guides on cleaning, repairing, and restoring game media, systems, and more.
    url: https://www.youtube.com/@RestoreAndReplay
    logo: assets/logos/restore-and-replay.png
    logo_alt: Restore and Replay (Eldoug) logo

databases:
  - name: No-Intro
    description: A community project focused on cataloging and verifying clean dumps of game cartridges and ROM files.
    url: https://no-intro.org/
    logo: assets/logos/no-intro.svg
    logo_alt: No-Intro logo

  - name: Redump
    description: A project dedicated to the preservation of optical disc-based games through accurate dumps and verification.
    url: https://redump.info
    logo: assets/logos/redump.png
    logo_alt: Redump logo

  - name: TOSEC
    description: The Old School Emulation Center - community-maintained dat files cataloging retro software across thousands of systems.
    url: https://www.tosecdev.org/
    logo: assets/logos/tosec.png
    logo_alt: TOSEC logo

resources:
  - name: The Cutting Room Floor (TCRF)
    description: A wiki documenting unused, hidden, and cut content found in video games through datamining and research.
    url: https://tcrf.net
    logo: assets/logos/the-cutting-room-floor-tcrf.png
    logo_alt: The Cutting Room Floor (TCRF) logo

  - name: Keitai Wiki
    description: A community wiki dedicated to documenting Japanese mobile phone games, platforms, and keitai culture.
    url: https://keitaiwiki.com/
    logo: assets/logos/keitai-wiki.png
    logo_alt: Keitai Wiki logo

  - name: Internet Archive
    description: Non-profit digital library with vast collections of software, games, manuals, and related media.
    url: https://archive.org/details/software
    logo: assets/logos/internet-archive.png
    logo_alt: Internet Archive logo

  - name: StrategyWiki
    description: A collaborative wiki cataloguing gameplay, mechanics, and structure across thousands of games.
    url: https://strategywiki.org/
    logo: assets/logos/strategywiki.png
    logo_alt: StrategyWiki logo

  - name: MobyGames
    description: Extensive catalog of game metadata, credits, cover art, and platform information across decades of releases.
    url: https://www.mobygames.com/
    logo: assets/logos/mobygames.png
    logo_alt: MobyGames logo

  - name: IGDB
    description: Internet Game Database - community-driven game metadata used by preservation projects, emulators, and frontends.
    url: https://www.igdb.com/
    logo: assets/logos/igdb.png
    logo_alt: IGDB logo

  - name: VGMdb
    description: Video Game Music Database - detailed catalog of game soundtracks, albums, composers, and track listings.
